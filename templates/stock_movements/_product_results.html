<div id="stock-product-results"
    class="absolute z-30 mt-2 max-h-60 w-full overflow-y-auto rounded-lg border border-slate-200 bg-white py-1 shadow-lg">

    {% for product in products %}
        <button type="button"
            class="flex w-full cursor-pointer items-center justify-between px-4 py-3 text-left text-sm transition hover:bg-blue-50"
            data-product-id="{{ product['id'] }}" data-product-name="{{ product['name'] }}"
            onclick="selectStockProduct(this.dataset.productId, this.dataset.productName)">

            <span class="font-medium text-slate-700">
                {{ product['name'] }}
            </span>

            <span class="ml-3 shrink-0 text-xs text-slate-500">
                Stock: {{ product['stock'] }}
            </span>
        </button>
    {% else %}
        <p class="px-4 py-4 text-center text-sm text-slate-500">
            No products found.
        </p>
    {% endfor %}

</div>
