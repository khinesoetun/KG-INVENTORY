<form method="POST" action="{{ url_for('product.edit_products', id=product['id']) }}"
    hx-post="{{ url_for('product.edit_products', id=product['id']) }}" hx-target="#product-{{ product['id'] }}"
    hx-swap="outerHTML" enctype="multipart/form-data">
    <div>
        <label class="text-sm font-medium text-slate-700">
            Product Name
        </label>

        <input type="text" name="name" value="{{ product['name'] }}"
            class="mt-2 w-full rounded-lg border border-slate-200 px-4 py-2 text-sm outline-none">
    </div>
    <div class="mt-4">
        <label class="text-sm font-medium text-slate-700">
            Category
        </label>
        <select name="category_id"
            class="mt-2 w-full rounded-lg border border-slate-200 px-4 py-2 text-sm outline-none">
            {% for category in categories %}
                <option value="{{ category['id'] }}" {% if category['id'] == product['category_id'] %} selected {% endif %}>
                    {{ category['name'] }}
                </option>
            {% endfor %}
        </select>
    </div>
    <div class="mt-4">
        <label class="text-sm font-medium text-slate-700">
            Selling Price
        </label>

        <input type="number" name="price" step="0.01" value="{{ product['price'] }}"
            class="mt-2 w-full rounded-lg border border-slate-200 px-4 py-2 text-sm outline-none">
    </div>
    <div class="mt-4">
        <label class="text-sm font-medium text-slate-700">
            Cost Price
        </label>

        <input type="number" name="cost_price" step="0.01" value="{{ product['cost_price'] }}"
            class="mt-2 w-full rounded-lg border border-slate-200 px-4 py-2 text-sm outline-none">
    </div>
    <div class="mt-4">
        <label class="text-sm font-medium text-slate-700">
            Stock
        </label>

        <input type="number" name="stock" value="{{ product['stock'] }}"
            class="mt-2 w-full rounded-lg border border-slate-200 px-4 py-2 text-sm outline-none">
    </div>
    <div x-data="{ preview: null }" class="mt-4">
        <label class="text-sm font-medium text-slate-700">
            Product Photo
        </label>

        <!-- Current Photo / New Preview -->
        <div class="mt-3">
            <img x-show="preview" :src="preview" class="h-32 w-32 rounded-lg object-cover" alt="New product preview">

            {% if product['photo'] %}
                <img x-show="!preview" src="{{ url_for('uploaded_file', filename=product['photo']) }}"
                    class="h-32 w-32 rounded-lg object-cover" alt="Current product photo">
            {% endif %}
        </div>

        <!-- File Input -->
        <input type="file" name="photo" accept="image/*" id="edit-product-photo" x-ref="photoInput" class="hidden"
            @change="
            if ($event.target.files.length) {
                preview = URL.createObjectURL($event.target.files[0])
            }
        ">

        <!-- Upload / Change -->
        <label for="edit-product-photo"
            class="mt-3 inline-block cursor-pointer rounded-lg border border-slate-200 px-4 py-2 text-sm font-medium text-slate-700 transition-colors hover:border-blue-500 hover:bg-blue-50">
            <span x-text="preview ? 'Change Photo' : 'Change Photo'"></span>
        </label>

        <!-- Cancel Selection -->
        <button type="button" x-show="preview" @click="
            preview = null;
            $refs.photoInput.value = ''
        "
            class="ml-2 cursor-pointer rounded-lg bg-slate-100 px-3 py-2 text-sm text-slate-600 transition-colors hover:bg-slate-200">
            Cancel selection
        </button>
    </div>
    <div class="mt-4 flex justify-end gap-2">
        <button type="button" @click="editOpen=false"
            class="mt-4 rounded-lg border border-slate-200 px-4 py-2 text-sm outline-none cursor-pointer  hover:bg-slate-500 transition-colors duration-200">
            Cancel
        </button>
        <button type="submit"
            class="mt-4 rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium cursor-pointer  hover:bg-blue-700 transition-colors duration-200">
            Save Change
        </button>
    </div>
</form>
<div id="edit-product-message"></div>
