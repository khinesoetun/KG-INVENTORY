<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KG Inventory | Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">
    <script src="{{ url_for('static', filename='js/lucide.min.js') }}"></script>
    <script defer src="{{ url_for('static', filename='js/alpine.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/htmx.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/chart.umd.min.js') }}"></script>
</head>

<body class="min-h-screen bg-slate-50">

    <main class="grid min-h-screen items-center gap-3 bg-slate-100 p-5 md:grid-cols-[1.15fr_1fr]">
        <!-- Left: Hero Image -->
        <section class="relative hidden h-[80vh] overflow-hidden rounded-2xl bg-slate-900 md:block">

            <img src="{{ url_for('static', filename='image/login-hero.jpg') }}" alt="KG Inventory workspace"
                class="absolute inset-0 h-full w-full object-cover">

            <div class="absolute inset-0 bg-gradient-to-br from-slate-950/80 via-blue-950/40 to-blue-900/20"></div>

            <div class="relative z-10 flex h-full flex-col justify-between p-12 text-white">

                <div class="text-xl font-bold tracking-wide">
                    KG Inventory
                </div>

                <div>
                    <h2 class="max-w-lg text-4xl font-bold leading-tight">
                        Manage Your Inventory.<br>
                        Grow Your Business.
                    </h2>

                    <p class="mt-4 max-w-md text-sm leading-6 text-slate-200">
                        A smarter way to manage products, stock and sales.
                    </p>
                </div>

                <p class="text-xs text-slate-300">
                    © 2026 KG Inventory
                </p>

            </div>
        </section>
        <section class="flex min-h-screen items-center justify-center bg-slate-50 px-6 py-10">
            <div class="w-full max-w-md rounded-[24px] border border-slate-200 bg-white p-8 shadow-xl">

                <div class="mb-8 text-center">
                    <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-xl bg-blue-600">
                        <span class="text-xl font-bold text-white">KG</span>
                    </div>

                    <h1 class="mt-4 text-2xl font-bold text-slate-800">
                        Welcome Back
                    </h1>

                    <p class="mt-2 text-sm text-slate-500">
                        Sign in to KG Inventory
                    </p>

                </div>
                <div id="login-error" role="alert"
                    class="hidden rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
                    <i data-lucide="circle-alert" class="mr-2 inline-block h-4 w-4"></i>
                    <span>Invalid username or password.</span>
                </div>

                <form hx-post="{{ url_for('auth.login') }}" hx-target="#login-error" hx-swap="innerHTML"
                    class="mt-8 space-y-5">
                    <div class="relative">
                        <div
                            class="absolute left-2 top-1/2 flex h-9 w-9 -translate-y-1/2 items-center justify-center rounded-full bg-blue-50 shadow-sm">

                            <i data-lucide="user" class="h-5 w-5 text-blue-700 stroke-[2.5]"></i>
                        </div>
                        <input type="text" id="username" name="username" placeholder="Enter your username"
                            class="w-full rounded-lg border border-slate-300 pl-14 pr-4 py-3 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
                            required>

                    </div>
                    <div class="relative">
                        <div
                            class="absolute left-2 top-1/2 flex h-9 w-9 -translate-y-1/2 items-center justify-center rounded-full bg-blue-50 shadow-sm">
                            <i data-lucide="lock" class="h-5 w-5 text-blue-700 stroke-[2.5]"></i>
                        </div>
                        <input type="password" id="password" name="password" placeholder="Enter your password"
                            class="w-full rounded-lg border border-slate-300 pl-14 pr-12 py-3 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
                            required>
                        <button type="button" id="togglePassword" class="absolute right-3 top-1/2 -translate-y-1/2
           text-slate-400 transition hover:text-blue-600 cursor-pointer">
                            <i data-lucide="eye" class="h-5 w-5"></i>
                        </button>
                    </div>
                    <div class="flex justify-end">
                        <a href="#" class="text-sm font-medium text-blue-600 transition hover:text-blue-700">
                            Forgot password?
                        </a>
                    </div>
                    <button type="submit"
                        class="w-full rounded-lg bg-blue-600 px-4 py-3 font-semibold text-white shadow-sm transition duration-200 hover:bg-blue-700 hover:shadow-md cursor-pointer">
                        Sign In
                    </button>
                </form>
            </div>
        </section>
    </main>
    <script>
        lucide.createIcons();

        const passwordInput = document.getElementById('password');
        const togglePassword = document.getElementById('togglePassword');

        togglePassword.addEventListener('click', function() {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                togglePassword.innerHTML = '<i data-lucide="eye-off" class="h-5 w-5"></i>';
            } else {
                passwordInput.type = 'password';
                togglePassword.innerHTML = '<i data-lucide="eye" class="h-5 w-5"></i>';
            }

            lucide.createIcons();
        });

        document.body.addEventListener("htmx:afterRequest", function(event) {
            const form = event.detail.elt;

            if (form.tagName !== "FORM" ||
                !form.querySelector('[name="username"]') ||
                !form.querySelector('[name="password"]')) {
                return;
            }

            const errorBox = document.getElementById("login-error");

            if (event.detail.successful) {
                errorBox.classList.add("hidden");
                errorBox.textContent = "";
            } else {
                errorBox.classList.remove("hidden");
            }
        });
    </script>
</body>

</html>
