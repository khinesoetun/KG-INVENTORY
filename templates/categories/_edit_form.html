<form method="POST" action="{{ url_for('category.edit_category', id=category['id']) }}"
    hx-post="{{ url_for('category.edit_category', id=category['id']) }}" hx-target="#category-{{ category['id'] }}"
    hx-swap="outerHTML" enctype="multipart/form-data">

    <input type="text" name="name" value="{{ category['name'] }}"
        class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm" required>
    <div x-data="{
    currentPhoto: {{ ('true' if category['photo'] else 'false') }},
    preview: null
}" class="mt-4">

        <!-- Current / Preview Photo -->
        <template x-if="preview || currentPhoto">
            <div class="mb-3">
                <img :src="preview || '{{ url_for('uploaded_file', filename=category['photo']) if category['photo'] else '' }}'"
                    class="h-32 w-32 rounded-lg object-cover" alt="Category photo preview">
            </div>
        </template>

        <!-- File Input -->
        <input type="file" name="photo" accept="image/*" id="edit-category-photo-{{ category['id'] }}"
            x-ref="photoInput" class="hidden" @change="
        if ($event.target.files.length) {
            preview = URL.createObjectURL($event.target.files[0])
        }
    ">

        <!-- Upload / Change Button -->
        <label for="edit-category-photo-{{ category['id'] }}"
            class="inline-block cursor-pointer rounded-lg border border-slate-200 px-4 py-2 text-sm font-medium text-slate-700 transition-colors hover:border-blue-500 hover:bg-blue-50">
            <span x-text="preview || currentPhoto ? 'Change Photo' : 'Upload Photo'"></span>
        </label>

        <!-- Remove Selected Photo -->
        <button type="button" x-show="preview" @click="
            preview = null;
            $refs.photoInput.value = ''
        "
            class="ml-2 cursor-pointer rounded-lg bg-slate-100 px-3 py-2 text-sm text-slate-600 transition-colors hover:bg-slate-200">
            Cancel selection
        </button>
    </div>
    <button type="submit"
        class="mt-4 w-full rounded-lg bg-blue-600 px-4 py-2 text-sm text-white cursor-pointer hover:bg-blue-700 transition-colors duration-200">
        Save change
    </button>
</form>

<button type="button" @click="editOpen=false"
    class="mt-2 w-full rounded-lg bg-slate-100 px-4 py-2 text-sm outline-noone cursor-pointer hover:bg-slate-500 transition-colors duration-200">
    Cancel</button>
<div id="edit-category-message"></div>
