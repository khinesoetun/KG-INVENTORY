<div class="w-full rounded-lg  border border-red-100 bg-red-50 p-3 py-1.5">
    <p class="text-sm text-slate-700">
        Delete this Category ?
    </p>
    <div class="mt-3 flex gap-2 ">
        <button type="button" @click="deleteOpen= false"
            class="rounded-lg bg-slate-100 px-4 py-2 text-sm text-slate-600 border border-slate-200 cursor-pointer hover:bg-slate-500 transition-colors duration-200">
            Cancel
        </button>
        <button type="button" hx-post="{{ url_for('category.delete_category',id=id) }}" hx-target="#category-cards"
            hx-swap="outerHTML"
            class="rounded-lg border border-red-200 bg-red-50 px-4 py-2 text-sm text-red-600 cursor-pointer hover:bg-red-100 transition-colors duration-200">
            Confirm
        </button>
    </div>
</div>
