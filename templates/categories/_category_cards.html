{% if message %}
    {% include "categories/_delete_message.html" %}
{% endif %}
<div id="category-cards" class="relative mt-6 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">

    {% for category in categories %}
        <div id="category-{{ category['id'] }}"
            class="max-w-xs bg-white p-4 rounded-lg shadow-sm transition duration-200 hover:-translate-y-1 hover:shadow-md cursor-pointer">
            <div class="mx-auto h-32 w-32 overflow-hidden rounded-full bg-slate-100">
                {% if category["photo"] %}
                    <img src="{{ url_for('uploaded_file', filename=category['photo']) }}"
                        class="mx-auto h-32 w-32 rounded-full object-cover " alt="{{ category['name'] }}">
                {% endif %}
            </div>
            <div class="mt-2 text-center items-center justify-between">

                <h2 class="text-lg font-semibold text-slate-800">
                    {{ category['name'] }}
                </h2>

                <span class="text-sm text-slate-500">
                    {{ category['product_count'] }} products
                </span>
            </div>


            <div class="mt-5 flex justify-center gap-2">
                <a href="{{ url_for("category.view_category",id=category['id']) }}"
                    class="w-16 bg-blue-600 rounded-lg py-2 text-sm text-white text-center cursor-pointer hover:bg-blue-700 transition-colors duration-200">
                    View
                </a>

                <button type="button" @click="editOpen=true"
                    hx-get="{{ url_for('category.edit_category',id=category['id']) }}" hx-target="#edit-category-form"
                    hx-swap="innerHTML"
                    class="w-16 bg-slate-100 rounded-lg px-3 py-2 text-sm text-slate-700 cursor-pointer hover:bg-slate-500 transition-colors duration-200">
                    Edit
                </button>
                <!--comfirm modal for delete-->
                <div x-data="{confirm:false}">
                    <button hx-get="{{ url_for('category.delete_confirm', id=category['id']) }}"
                        hx-target="#delete-confirm-modal" hx-swap="innerHTML"
                        class="w-16 bg-red-50 rounded-lg px-3 py-2 text-sm  text-red-600 cursor-pointer hover:bg-red-100 transition-colors duration-200"
                        @click="deleteOpen=true ">
                        Delete
                    </button>

                </div>
            </div>
        </div>
    {% endfor %}

</div>
